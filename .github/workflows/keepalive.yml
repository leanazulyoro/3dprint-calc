name: Keep Supabase awake

# Free projects pause after a week without requests. One query a day keeps it up.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the Data API
        run: |
          curl -fsS "${{ vars.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/workshops?select=id&limit=1" \
            -H "apikey: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Authorization: Bearer ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" \
            -o /dev/null -w "HTTP %{http_code}\n"
